<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="100%" stop-color="#1a103c"/>
    </linearGradient>
    
    <!-- Outer Glow Gradient -->
    <linearGradient id="cyan-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="inner-core-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg-grad)" stroke="url(#cyan-purple-grad)" stroke-width="2.5"/>

  <!-- Orbital Rings / Quantum Connections -->
  <ellipse cx="64" cy="64" rx="46" ry="20" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" transform="rotate(-30 64 64)"/>
  <ellipse cx="64" cy="64" rx="46" ry="20" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.7" transform="rotate(30 64 64)"/>

  <!-- Stylized Quantum Chrome Iris Core -->
  <g filter="url(#glow)">
    <!-- Outer Ring -->
    <circle cx="64" cy="64" r="32" fill="none" stroke="url(#cyan-purple-grad)" stroke-width="4"/>
    
    <!-- Inner Core Glass Orb -->
    <circle cx="64" cy="64" r="14" fill="url(#inner-core-grad)"/>
    <circle cx="64" cy="64" r="14" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

    <!-- Lightning / Bridge Rays -->
    <path d="M 64 32 L 64 18" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 64 96 L 64 110" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 36 50 L 22 42" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 92 78 L 106 86" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Orbital Nodes -->
  <circle cx="26" cy="44" r="3.5" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="102" cy="84" r="3.5" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="88" cy="38" r="2.5" fill="#60a5fa"/>
  <circle cx="40" cy="90" r="2.5" fill="#c084fc"/>
</svg>